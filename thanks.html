<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Received — Engineer by Choice</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#FFFFFF;color:#475569;font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    .label{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#334155;margin-bottom:20px}
    h1{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:800;letter-spacing:-.03em;color:#0F172A;line-height:1.05}
    h1 span{color:#1D4ED8}
    p{font-size:1.0625rem;line-height:1.65;margin:20px 0 32px;max-width:420px}
    a{display:inline-block;background:#1D4ED8;color:#fff;font-weight:600;padding:14px 24px;border-radius:8px;text-decoration:none;transition:background .2s}
    a:hover{background:#1E40AF}
    a:focus-visible{outline:2px solid #1D4ED8;outline-offset:3px}
  </style>
</head>
<body>
  <div class="label">Engineer by Choice</div>
  <h1>Message <span>received</span>.</h1>
  <p>Thank you for reaching out. I respond within 24 hours — usually sooner.</p>
  <a href="/">Back to home →</a>
</body>
</html>
