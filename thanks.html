<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Received — Engineer by Choice</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080808;color:#f0ede8;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .label{font-family:monospace;font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:#c9a84c;margin-bottom:1.2rem}
    h1{font-family:Georgia,serif;font-size:clamp(2.2rem,8vw,4.5rem);font-weight:700;letter-spacing:.04em;color:#f0ede8;line-height:1.1;margin-bottom:.5rem}
    .line{width:60px;height:1px;background:#c9a84c;margin:1.8rem auto}
    p{font-size:1rem;color:rgba(240,237,232,.55);font-style:italic;margin-bottom:2.5rem;max-width:400px;line-height:1.8}
    a{display:inline-block;font-family:monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;padding:.9rem 2.2rem;background:#c9a84c;color:#080808;text-decoration:none;transition:background .3s}
    a:hover{background:#f0ede8}
  </style>
</head>
<body>
  <div class="label">Engineer by Choice</div>
  <h1>Message Received.</h1>
  <div class="line"></div>
  <p>Thank you for reaching out. I respond within 24 hours — usually sooner.</p>
  <a href="/">Back to Home</a>
</body>
</html>
